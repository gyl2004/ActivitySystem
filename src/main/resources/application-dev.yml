spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/activity_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 数据库密码通过环境变量 DB_PASSWORD 注入，禁止提交明文
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000
    elasticsearch:
      uris: ${ES_URIS:http://localhost:9200}
      connection-timeout: 5s
      socket-timeout: 30s
    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:guest}
      publisher-confirm-type: correlated
      publisher-returns: true
      template:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
      listener:
        simple:
          auto-startup: false # 开发环境下默认不启动监听器，避免连接失败导致报错
          retry:
            enabled: true
            initial-interval: 1000ms
            max-attempts: 3
            multiplier: 2.0

jwt:
  # JWT 签名密钥通过环境变量 JWT_SECRET 注入（至少 32 字节），禁止提交真实密钥
  secret: ${JWT_SECRET:change-me-to-a-32-bytes-minimum-secret}
  expiration: 86400 # 24 hours
  header: Authorization
  prefix: Bearer
