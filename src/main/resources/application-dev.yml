spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/activity_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
    elasticsearch:
      uris: http://localhost:9200
      connection-timeout: 5s
      socket-timeout: 30s
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest
      listener:
        simple:
          retry:
            enabled: true
            initial-interval: 1000ms
            max-attempts: 3
            multiplier: 2.0

